- rule_id: R-PRI-002
  version: 1
  title: FT(PMC) category may apply
  topics:
  - priority_considerations
  kind: preparation
  basis: interpretation
  requires_human_review: true
  when:
    all:
    - *id003
    - &id006
      all:
      - field: applicant_1.prior_flat_or_subsidy
        eq: false
      - field: applicant_2.prior_flat_or_subsidy
        eq: false
    - any:
      - field: applicant_1.age
        lt: 41
      - field: applicant_2.age
        lt: 41
      - field: children_or_expecting
        eq: true
  exceptions:
  - id: X-I01
    when:
      any:
      - field: applicant_1.age
        gte: 41
      - field: applicant_2.age
        gte: 41
    effect: human_review
    note: One partner is over 40; HDB does not say whose age the 'aged 40 and below' criterion uses (I-01).
    fact_ids:
    - PRI-FTPMC-001
  interpretations:
  - id: I-01
    note: Whose age counts is not stated.
  - id: I-08
    note: '''Never owned or sold a residential property'' is broader than the profile field.'
  limitations: []
  action: 'Your household may fall within the FT(PMC) category. There is nothing to request: HDB assesses
    it after the flat application. HDB''s other conditions are not captured here: never having owned or
    sold a residential property, no chance to book a BTO/SBF flat in the past 5 years, and (for families)
    an SC child aged 18 or below.'
  source_fact_ids:
  - PRI-FTPMC-001
  - PRI-FTPMC-002
  - PRI-FTPMC-003
  sources:
  - source_id: S05
    section: Priority Schemes > First-Timer (Parents & Married Couples), or FT(PMC) category > Flat allocation
    url: https://www.hdb.gov.sg/buying-a-flat/bto-sbf-and-open-booking-of-flats/process-for-buying-a-new-flat/application/priority-schemes
  - source_id: S05
