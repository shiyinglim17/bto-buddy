- rule_id: R-NS-001
  version: 1
  title: Booking when invited, and the waiver
  topics:
  - non_selection
  kind: caution
  basis: source_established
  requires_human_review: false
  when:
    any:
    - field: applicant_1.prior_flat_or_subsidy
      eq: false
    - field: applicant_2.prior_flat_or_subsidy
      eq: false
  exceptions: []
  interpretations: []
  limitations: []
  action: If you are invited to book while flats are available, choosing none gives a non-selection count
    and cancels your ongoing applications; for first-timer families, later applications move to the second-timer
    category for a year and extra ballot chances built up for Standard BTO flats reset to 0. HDB waives
    the count when 10 or fewer BTO flats (5 or fewer SBF flats) are left to choose from.
  source_fact_ids:
  - NS-COUNT-001
  - NS-WAIVE-001
  - NS-FT-001
  sources:
  - source_id: S04
    section: Application for a New Flat > Cancellation of flat application > Financial forfeitures and
      consequences after cancellation
    url: https://www.hdb.gov.sg/buying-a-flat/bto-sbf-and-open-booking-of-flats/process-for-buying-a-new-flat/application?anchor=cancellation
  effective:
    from: null
    to: null
    basis: as published at retrieval (2026-10-28); no stated effective date
- rule_id: R-NS-002
  version: 1
  title: Cancelling a flat application
  topics:
  - non_selection
  kind: caution
  basis: source_established
  requires_human_review: false
  when: *id005
  exceptions: []
  interpretations: []
  limitations: []
  action: Cancelling during the application period carries no penalty. A cancelled application cannot
    be reinstated. Cancelling after booking forfeits the option fee, or 5% of the purchase price once
    the Agreement for Lease is signed, and you must wait a year (with the forfeiture paid) before applying
    again.
