      ballot chance
    url: https://www.hdb.gov.sg/buying-a-flat/bto-sbf-and-open-booking-of-flats/process-for-buying-a-new-flat/application/priority-schemes
  effective:
    from: null
    to: null
    basis: as published at retrieval (2026-10-28); no stated effective date
